server:
  address: 127.0.0.1
  port: ${MAINTENANCE_PORT:8081}
spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${MAINTENANCE_DB_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/kestrel}
    username: ${MAINTENANCE_DB_USER:maintenance_app}
    password: ${MAINTENANCE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    default-schema: maintenance
    schemas: maintenance
    create-schemas: false
  jackson:
    default-property-inclusion: non_null
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
kestrel:
  keys-dir: ${KESTREL_KEYS_DIR:.kestrel/keys}
  demo:
    admin: ${KESTREL_DEMO_ADMIN_PASSWORD:}
    maintenance-operator: ${KESTREL_DEMO_MAINTENANCE_PASSWORD:}
    technician: ${KESTREL_DEMO_TECHNICIAN_PASSWORD:}
    inventory-operator: ${KESTREL_DEMO_INVENTORY_PASSWORD:}
